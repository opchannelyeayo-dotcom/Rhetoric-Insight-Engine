<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>話術透視鏡 — 後台管理</title><style>
:root{--navy:#0b1f3a;--navy2:#17375e;--blue:#2563a8;--bg:#f3f6fa;--line:#dce3ec;--muted:#66758a;--red:#b42318;--green:#087a55}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#15243a;background:var(--bg)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#081a32,#173b65)}.login-card{width:min(420px,calc(100% - 32px));background:#fff;border-radius:14px;padding:38px;box-shadow:0 20px 60px #0005}.brandmark{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;background:var(--navy);color:white;font-weight:800;font-size:23px}.login h1{margin:18px 0 5px;font-size:24px}.muted{color:var(--muted)}label{font-size:13px;font-weight:700;display:block;margin:18px 0 7px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:10px 12px;background:white}textarea{min-height:105px;resize:vertical}.btn{border:0;border-radius:7px;background:var(--navy);color:#fff;padding:10px 16px;cursor:pointer;font-weight:700}.btn:hover{background:var(--navy2)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid #cbd5e1}.btn.danger{background:#fff;color:var(--red);border:1px solid #efb4ae}.login .btn{width:100%;margin-top:22px}.error{color:var(--red);font-size:14px;margin-top:12px}.top{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:5}.top .title{font-size:19px;font-weight:800;margin-left:12px}.top .admin-label{font-size:12px;border-left:1px solid var(--line);padding-left:12px;margin-left:12px;color:var(--muted)}.account{margin-left:auto;text-align:right;font-size:13px}.account b{display:block}.nav{background:var(--navy);display:flex;padding:0 24px;gap:2px;overflow:auto;white-space:nowrap}.nav button,.nav a{color:#cad5e4;background:none;border:0;padding:15px 13px;text-decoration:none;cursor:pointer;font-size:13px}.nav button.active,.nav button:hover,.nav a:hover{color:white;background:#ffffff15}.main{padding:26px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px;gap:15px}.page-head h1{font-size:25px;margin:0 0 4px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 1px 2px #14223809}.card{padding:18px}.card .value{font-size:29px;font-weight:800;margin-top:10px}.card .label{font-size:13px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel{padding:18px}.panel h2{font-size:16px;margin:0 0 16px}.bars{display:flex;flex-direction:column;gap:11px}.barrow{display:grid;grid-template-columns:100px 1fr 35px;align-items:center;font-size:12px;gap:8px}.track{height:8px;background:#e9eef4;border-radius:4px}.fill{height:100%;background:#3d72a9;border-radius:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{width:auto;min-width:155px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}table{border-collapse:collapse;width:100%;min-width:830px}th,td{padding:12px 13px;border-bottom:1px solid #e6ebf1;text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc;color:#526176;font-weight:700}.pill{border-radius:999px;padding:4px 8px;font-size:11px;background:#e8eef6;display:inline-block}.pill.high_risk,.pill.critical{background:#fee4e2;color:#b42318}.pill.approved,.pill.safe,.pill.low{background:#dff5eb;color:#087a55}.pill.pending,.pill.suspicious,.pill.medium{background:#fff0cc;color:#8a5b00}.actions{display:flex;gap:5px}.actions button{font-size:12px;padding:5px 8px}.empty{text-align:center;padding:34px;color:var(--muted)}.modal{position:fixed;inset:0;background:#06142599;display:grid;place-items:center;z-index:20;padding:20px}.dialog{background:#fff;border-radius:10px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:24px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog h2{margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span2{grid-column:1/-1}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.notice{background:#eaf2fb;border-left:4px solid var(--blue);padding:13px;margin-bottom:16px;font-size:13px}.quick{display:flex;gap:8px;flex-wrap:wrap}.region-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.region{background:#f7f9fc;border:1px solid var(--line);padding:12px;border-radius:7px;text-align:center}.region b{display:block;font-size:20px;margin-top:5px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.nav{padding:0 8px}.top{padding:0 15px}.main{padding:18px}.region-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.account span{display:none}.login-card{padding:28px 22px}.page-head{align-items:start;flex-direction:column}.toolbar>*{width:100%!important}.region-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<section id="login" class="login"><form id="loginForm" class="login-card"><div class="brandmark">話</div><h1>話術透視鏡 · 後台</h1><div class="muted">請登入以管理分析紀錄</div><label>帳號</label><input name="username" autocomplete="username" required><label>密碼</label><input name="password" type="password" autocomplete="current-password" required><button class="btn">登入後台</button><div id="loginError" class="error"></div></form></section>
<div id="app" class="hidden"><header class="top"><div class="brandmark">話</div><div class="title">話術透視鏡</div><div class="admin-label">後台管理</div><div class="account"><b id="who"></b><span id="role"></span></div></header><nav class="nav" id="nav"></nav><main class="main" id="main"></main></div><div id="modal" class="modal hidden"></div>
<script>window.PUBLIC_SITE_URL=__PUBLIC_SITE_URL__;
const S={user:null,page:'dashboard',rows:[]}; const roles={super_admin:'超級管理員',content_reviewer:'內容審核員',readonly:'只讀使用者'};
const pages=[['dashboard','儀表板'],['records','分析紀錄'],['drugs','藥品資料庫'],['tags','話術風險標籤'],['analyze','風險分析'],['urls','網址查詢紀錄'],['users','使用者管理']];
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...opt.headers}});if(r.status===401){showLogin();throw Error('請重新登入')}const data=(r.headers.get('content-type')||'').includes('json')?await r.json():await r.text();if(!r.ok)throw Error(data.error||'操作失敗');return data}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showLogin(){document.querySelector('#login').classList.remove('hidden');document.querySelector('#app').classList.add('hidden')}function toast(x){alert(x)}
document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();document.querySelector('#loginError').textContent='';try{S.user=await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});boot()}catch(x){document.querySelector('#loginError').textContent=x.message}};
function boot(){document.querySelector('#login').classList.add('hidden');document.querySelector('#app').classList.remove('hidden');document.querySelector('#who').textContent=S.user.username;document.querySelector('#role').textContent=roles[S.user.role];renderNav();go('dashboard')}
function renderNav(){document.querySelector('#nav').innerHTML=pages.map(p=>`<button data-p="${p[0]}">${p[1]}</button>`).join('')+`<a href="${esc(window.PUBLIC_SITE_URL||'/')}" target="_blank">回首頁</a><button id="logout">登出</button>`;document.querySelector('#nav').onclick=async e=>{if(e.target.dataset.p)go(e.target.dataset.p);if(e.target.id==='logout'){await api('/api/auth/logout',{method:'POST'});showLogin()}}}
async function go(p){S.page=p;document.querySelectorAll('#nav [data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===p));const m=document.querySelector('#main');m.innerHTML='<div class="empty">載入中…</div>';try{if(p==='dashboard')await dashboard(m);else if(p==='analyze')analyze(m);else await listing(m,p)}catch(e){m.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function bars(data){if(!data?.length)return '<div class="empty">尚無資料</div>';const max=Math.max(...data.map(x=>+x.value),1);return `<div class="bars">${data.map(x=>`<div class="barrow"><span>${esc(x.label)}</span><div class="track"><div class="fill" style="width:${x.value/max*100}%"></div></div><b>${x.value}</b></div>`).join('')}</div>`}
async function dashboard(m){const d=await api('/api/stats');m.innerHTML=`<div class="page-head"><div><h1>儀表板</h1><div class="muted">內容風險與資料品質總覽</div></div><button class="btn" onclick="go('analyze')">開始風險分析</button></div><div class="cards"><div class="card"><div class="label">總分析筆數</div><div class="value">${d.analyses.total}</div></div><div class="card"><div class="label">平均信任度</div><div class="value">${d.analyses.avg}%</div></div><div class="card"><div class="label">風險標籤總數</div><div class="value">${d.tags.total}</div></div><div class="card"><div class="label">待審核 / 未驗證</div><div class="value">${d.tags.pending} / ${d.tags.unverified}</div></div></div><div class="grid2"><div class="panel"><h2>六大話術分類分佈</h2>${bars(d.types)}</div><div class="panel"><h2>每日信任度趨勢</h2>${bars(d.trend)}</div><div class="panel"><h2>審核狀態</h2>${bars(d.statuses)}</div><div class="panel"><h2>風險等級</h2>${bars(d.risks)}</div><div class="panel span2"><h2>地區覆蓋</h2><div class="region-grid">${['台灣','香港','澳門','新加坡','馬來西亞','日本'].map(r=>`<div class="region">${r}<b>${d.regions.find(x=>x.label===r)?.value||0}</b></div>`).join('')}</div></div><div class="panel"><h2>送審文案×資料庫交叉比對</h2><p class="muted">目前有 ${d.tags.pending} 筆待審標籤，${d.drugs.total} 筆藥品／保健品紀錄可供交叉比對。</p></div><div class="panel"><h2>快速操作</h2><div class="quick"><button class="btn ghost" onclick="go('records')">查看分析</button><button class="btn ghost" onclick="go('tags')">審核標籤</button><button class="btn ghost" onclick="go('drugs')">新增資料</button></div></div></div>`}
const cfg={records:{title:'分析紀錄',cols:[['input_type','來源'],['input_summary','內容摘要'],['tactic_types','話術分類'],['trust_score','信任度'],['risk_level','風險'],['created_at','日期']]},drugs:{title:'藥品／保健品資料庫',cols:[['name','名稱'],['approval_number','核准字號'],['manufacturer','廠商'],['category','分類'],['status','狀態']]},tags:{title:'話術風險標籤資料庫',cols:[['label','標籤'],['group_name','分組'],['tactic_type','話術分類'],['status','審核'],['region','地區'],['needs_review','重審']]},urls:{title:'網址查詢紀錄',cols:[['url','網址'],['status','判定'],['reason','依據'],['is_test','測試'],['created_at','日期']]},users:{title:'使用者管理',cols:[['username','帳號'],['role','角色'],['is_active','啟用'],['last_login','最後登入']]}};
function val(k,v){if(k==='created_at'||k==='last_login')return v?new Date(v).toLocaleString('zh-TW'):'—';if(Array.isArray(v))return v.join('、');if(typeof v==='boolean')return v?'是':'否';if(['status','risk_level'].includes(k))return `<span class="pill ${esc(v)}">${esc(v)}</span>`;return esc(v??'—')}
async function listing(m,p){const c=cfg[p];m.innerHTML=`<div class="page-head"><div><h1>${c.title}</h1><div class="muted">查詢、篩選與管理持久化資料</div></div><div class="quick">${['drugs','tags','users'].includes(p)&&S.user.role!=='readonly'?`<button class="btn" onclick="edit('${p}')">新增</button>`:''}${p!=='users'?`<a class="btn ghost" href="/api/${p}/export">匯出 CSV</a>`:''}</div></div><div class="toolbar"><input id="search" placeholder="搜尋關鍵字…"><select id="filter"><option value="">全部狀態／分類</option>${filters(p)}</select>${p==='drugs'&&S.user.role!=='readonly'?'<input id="csvfile" type="file" accept=".csv"><button class="btn ghost" onclick="importCsv()">匯入 CSV</button>':''}${p==='urls'&&S.user.role!=='readonly'?'<button class="btn danger" onclick="clearTests()">清除測試資料</button>':''}</div><div id="table"></div>`;document.querySelector('#search').oninput=()=>loadRows(p);document.querySelector('#filter').onchange=()=>loadRows(p);await loadRows(p)}
function filters(p){const x=p==='records'?[['input_type=text','文字輸入'],['input_type=image','截圖 OCR'],['risk_level=high','高風險']]:p==='drugs'?[['category=藥品','藥品'],['category=健康食品／保健品','健康食品／保健品'],['category=其他','其他']]:p==='tags'?[['status=draft','草稿'],['status=pending','待審核'],['status=approved','已核准'],['status=needs_revision','需修改']]:p==='urls'?[['status=safe','安全'],['status=suspicious','可疑'],['status=high_risk','高風險'],['status=unknown','無法判斷']]:[];return x.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('')}
async function loadRows(p){const q=document.querySelector('#search')?.value||'';const f=document.querySelector('#filter')?.value||'';S.rows=await api(`/api/${p}?q=${encodeURIComponent(q)}${f?'&'+f:''}`);const c=cfg[p],write=S.user.role!=='readonly'&&(p!=='users'||S.user.role==='super_admin');document.querySelector('#table').innerHTML=S.rows.length?`<div class="table-wrap"><table><thead><tr>${c.cols.map(x=>`<th>${x[1]}</th>`).join('')}<th>操作</th></tr></thead><tbody>${S.rows.map(r=>`<tr>${c.cols.map(x=>`<td>${val(x[0],r[x[0]])}</td>`).join('')}<td><div class="actions"><button class="btn ghost" onclick="detail('${p}',${r.id})">詳情</button>${write&&p!=='records'&&p!=='urls'?`<button class="btn ghost" onclick="edit('${p}',${r.id})">編輯</button>`:''}${write&&p!=='urls'?`<button class="btn danger" onclick="del('${p}',${r.id})">刪除</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="panel empty">尚無符合條件的資料</div>'}
function detail(p,id){const r=S.rows.find(x=>x.id===id);modal(`<h2>詳細資料</h2><pre style="white-space:pre-wrap;line-height:1.7">${esc(JSON.stringify(r,null,2))}</pre>`)}
function modal(body){document.querySelector('#modal').innerHTML=`<div class="dialog"><div class="dialog-head">${body}<button class="btn ghost" onclick="closeModal()">關閉</button></div></div>`;document.querySelector('#modal').classList.remove('hidden')}function closeModal(){document.querySelector('#modal').classList.add('hidden')}
const fields={drugs:[['name','名稱'],['approval_number','核准字號'],['manufacturer','廠商'],['category','分類'],['approved_date','核准日'],['ingredients','成分'],['claims','宣稱'],['status','狀態']],tags:[['label','標籤'],['group_name','三大分組'],['tactic_type','六大話術分類'],['status','審核狀態'],['region','地區'],['legal_basis','法源'],['historical_cases','歷年案例'],['suggested_rewrite','建議文案'],['localized_content','地區化內容'],['risk_override','風險覆寫'],['verification_status','驗證狀態'],['needs_review','待重新審查']],users:[['username','帳號'],['password','密碼'],['role','角色'],['is_active','啟用']]};
function edit(p,id){const r=S.rows.find(x=>x.id===id)||{};const fs=fields[p];const html=`<form id="editform"><div class="dialog-head"><h2>${id?'編輯':'新增'}${cfg[p].title}</h2><button type="button" class="btn ghost" onclick="closeModal()">關閉</button></div><div class="formgrid">${fs.map(([k,l])=>{if(k==='needs_review'||k==='is_active')return `<label><input style="width:auto" type="checkbox" name="${k}" ${r[k]?'checked':''}> ${l}</label>`;if(['legal_basis','historical_cases','suggested_rewrite','localized_content'].includes(k))return `<label class="span2">${l}<textarea name="${k}">${esc(r[k]||'')}</textarea></label>`;return `<label>${l}<input name="${k}" value="${esc(r[k]||'')}" ${!id&&['name','label','username','password'].includes(k)?'required':''}></label>`}).join('')}</div><div class="dialog-actions"><button type="button" class="btn ghost" onclick="closeModal()">取消</button><button class="btn">儲存</button></div></form>`;document.querySelector('#modal').innerHTML=`<div class="dialog">${html}</div>`;document.querySelector('#modal').classList.remove('hidden');document.querySelector('#editform').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));fs.filter(x=>['needs_review','is_active'].includes(x[0])).forEach(x=>b[x[0]]=e.target.elements[x[0]].checked);if(id&&p==='users'&&!b.password)delete b.password;try{await api(`/api/${p}${id?'/'+id:''}`,{method:id?'PATCH':'POST',body:JSON.stringify(b)});closeModal();loadRows(p)}catch(x){toast(x.message)}}}
async function del(p,id){if(!confirm('確定刪除這筆資料？'))return;try{await api(`/api/${p}/${id}`,{method:'DELETE'});loadRows(p)}catch(e){toast(e.message)}}async function clearTests(){if(confirm('確定清除所有測試網址紀錄？')){await api('/api/urls/test/all',{method:'DELETE'});loadRows('urls')}}async function importCsv(){const f=document.querySelector('#csvfile').files[0];if(!f)return toast('請選擇 CSV');const d=new FormData();d.append('file',f);try{const x=await api('/api/drugs/import',{method:'POST',body:d});toast(`已匯入 ${x.count} 筆`);loadRows('drugs')}catch(e){toast(e.message)}}
function analyze(m){m.innerHTML=`<div class="page-head"><div><h1>話術風險分析</h1><div class="muted">建議結果需再由審核員與法務確認</div></div></div><div class="grid2"><form class="panel" id="analyzeForm"><h2>待分析文案</h2><label>應用場景</label><select name="scene">${['銷售','客服','醫療','直播帶貨','社群貼文／KOL'].map(x=>`<option>${x}</option>`).join('')}</select><label>文字內容</label><textarea name="text" required placeholder="貼上想要檢視的話術…"></textarea><button class="btn" style="margin-top:14px">產生分析</button></form><div class="panel" id="analysisOut"><div class="empty">分析結果將顯示在這裡</div></div></div>`;document.querySelector('#analyzeForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/analyze',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});document.querySelector('#analysisOut').innerHTML=`<h2>風險標籤與依據</h2>${d.tags.map(x=>`<p><span class="pill ${x.risk}">${esc(x.label)}</span> ${esc(x.evidence)}</p>`).join('')}<h2>建議改寫</h2><div class="notice">${esc(d.rewrite)}</div><h2>法條與案例</h2><p>${esc(d.legal)}</p><p class="muted">${esc(d.cases)}</p>`}catch(x){toast(x.message)}}}
(async()=>{try{S.user=await api('/api/auth/me');boot()}catch{showLogin()}})();
</script></body></html>
