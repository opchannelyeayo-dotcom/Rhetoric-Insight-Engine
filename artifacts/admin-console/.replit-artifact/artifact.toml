kind = "web"
previewPath = "/"
title = "話術透視鏡 — 後台管理"
description = "獨立部署的繁體中文內容風險管理後台，提供審核、資料庫、分析紀錄、網址查詢與使用者權限管理。"
version = "1.0.0"
id = "artifacts/admin-console"
router = "path"

[[services]]
name = "admin-web"
paths = [ "/" ]
localPort = 21906

[services.development]
run = "pnpm --filter @workspace/admin-console run dev"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/admin-console", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "node", "artifacts/admin-console/dist/server.mjs" ]

[services.production.run.env]
PORT = "21906"
NODE_ENV = "production"

[services.production.health.startup]
path = "/health"

[services.env]
PORT = "21906"
BASE_PATH = "/"
